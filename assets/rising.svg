<!-- BOTTOM: something rises out of the dark while the last words type themselves.
     Edit a line's <text>; if longer, raise the width numbers in its clipPath. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <filter id="st" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1">
        <animate attributeName="seed" values="1;7;3;9;5;2;8" dur=".5s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence>
      <feColorMatrix values="0 0 0 0 .6  0 0 0 0 .05  0 0 0 0 .05  0 0 0 .25 0"/></filter>
    <radialGradient id="m" cx="50%" cy="50%" r="50%"><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="mk"><rect x="320" y="0" width="260" height="260" fill="url(#m)"/></mask>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#030000" stop-opacity="0"/><stop offset=".9" stop-color="#030000"/></linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="230" fill="#030000"/>
  <g mask="url(#mk)">
    <g><animateTransform attributeName="transform" type="translate" values="0 170;0 170;0 0;0 0;0 170" keyTimes="0;.1;.55;.85;1" dur="10s" repeatCount="indefinite"/>
      <image x="320" y="0" width="260" height="260" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64," href="data:image/jpeg;base64," /></g>
  </g>
  <rect width="900" height="230" fill="url(#floor)"/>
  <g font-family="'Courier New',Courier,monospace" font-size="22" fill="#ff1a1a" filter="url(#glow)">
  <clipPath id="c0"><rect x="40" y="44" height="34" width="0"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.05;0.17;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <text x="40" y="70" clip-path="url(#c0)">you left an offering.</text><clipPath id="c1"><rect x="600" y="84" height="34" width="0"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.3;0.42;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <text x="600" y="110" clip-path="url(#c1)">now it wants</text><clipPath id="c2"><rect x="640" y="124" height="34" width="0"><animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.45;0.57;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <text x="640" y="150" clip-path="url(#c2)">another.</text>
  </g>
  <rect width="900" height="230" filter="url(#st)"/>
</svg>
