      <text x="24" y="20"><tspan fill="#5a1010">[852] anon &#8250;</tspan> <tspan fill="#e02020">ahh fresh meat</tspan></text><text x="24" y="44"><tspan fill="#5a1010">[912] anon &#8250;</tspan> <tspan fill="#e02020">what are you</tspan></text><text x="24" y="68"><tspan fill="#5a1010">[312] anon &#8250;</tspan> <tspan fill="#e02020">wumble what species is a wumble</tspan></text><text x="24" y="92"><tspan fill="#5a1010">[202] anon &#8250;</tspan> <tspan fill="#e02020">I see you around everywhere and everytime</tspan></text><text x="24" y="116"><tspan fill="#5a1010">[282] anon &#8250;</tspan> <tspan fill="#e02020">you scare me</tspan></text><text x="24" y="140"><tspan fill="#5a1010">[915] anon &#8250;</tspan> <tspan fill="#e02020">can i join your wumble cult</tspan></text><text x="24" y="164"><tspan fill="#5a1010">[904] anon &#8250;</tspan> <tspan fill="#e02020">this cult is something really</tspan></text><text x="24" y="188"><tspan fill="#5a1010">[576] anon &#8250;</tspan> <tspan fill="#e02020">Red critter!</tspan></text><text x="24" y="212"><tspan fill="#5a1010">[436] anon &#8250;</tspan> <tspan fill="#e02020">what is wumble. what is this. how do i wumble</tspan></text><text x="24" y="236"><tspan fill="#5a1010">[934] anon &#8250;</tspan> <tspan fill="#e02020">hey there. stop it. stop it now. i said stop</tspan></text><text x="24" y="260"><tspan fill="#5a1010">[499] anon &#8250;</tspan> <tspan fill="#e02020">you are a very interesting fellow.</tspan></text><text x="24" y="284"><tspan fill="#5a1010">[840] anon &#8250;</tspan> <tspan fill="#e02020">tickle it more</tspan></text><text x="24" y="308"><tspan fill="#5a1010">[868] anon &#8250;</tspan> <tspan fill="#e02020">i love you</tspan></text><text x="24" y="332"><tspan fill="#5a1010">[822] anon &#8250;</tspan> <tspan fill="#e02020">lelelelele</tspan></text><text x="24" y="356"><tspan fill="#5a1010">[440] anon &#8250;</tspan> <tspan fill="#e02020">Why is it colourfull aww...barks??</tspan></text><text x="24" y="380"><tspan fill="#5a1010">[779] anon &#8250;</tspan> <tspan fill="#e02020">ahh fresh meat</tspan></text><text x="24" y="404"><tspan fill="#5a1010">[397] anon &#8250;</tspan> <tspan fill="#e02020">what are you</tspan></text><text x="24" y="428"><tspan fill="#5a1010">[982] anon &#8250;</tspan> <tspan fill="#e02020">wumble what species is a wumble</tspan></text><text x="24" y="452"><tspan fill="#5a1010">[972] anon &#8250;</tspan> <tspan fill="#e02020">I see you around everywhere and everytime</tspan></text><text x="24" y="476"><tspan fill="#5a1010">[943] anon &#8250;</tspan> <tspan fill="#e02020">you scare me</tspan></text><text x="24" y="500"><tspan fill="#5a1010">[778] anon &#8250;</tspan> <tspan fill="#e02020">can i join your wumble cult</tspan></text><text x="24" y="524"><tspan fill="#5a1010">[977] anon &#8250;</tspan> <tspan fill="#e02020">this cult is something really</tspan></text><text x="24" y="548"><tspan fill="#5a1010">[833] anon &#8250;</tspan> <tspan fill="#e02020">Red critter!</tspan></text><text x="24" y="572"><tspan fill="#5a1010">[733] anon &#8250;</tspan> <tspan fill="#e02020">what is wumble. what is this. how do i wumble</tspan></text><text x="24" y="596"><tspan fill="#5a1010">[529] anon &#8250;</tspan> <tspan fill="#e02020">hey there. stop it. stop it now. i said stop</tspan></text><text x="24" y="620"><tspan fill="#5a1010">[813] anon &#8250;</tspan> <tspan fill="#e02020">you are a very interesting fellow.</tspan></text><text x="24" y="644"><tspan fill="#5a1010">[522] anon &#8250;</tspan> <tspan fill="#e02020">tickle it more</tspan></text><text x="24" y="668"><tspan fill="#5a1010">[517] anon &#8250;</tspan> <tspan fill="#e02020">i love you</tspan></text><text x="24" y="692"><tspan fill="#5a1010">[166] anon &#8250;</tspan> <tspan fill="#e02020">lelelelele</tspan></text><text x="24" y="716"><tspan fill="#5a1010">[631] anon &#8250;</tspan> <tspan fill="#e02020">Why is it colourfull aww...barks??</tspan></text>
